name: Build, check and package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version metadata
        run: python tools/release.py --check
      - name: Check version tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py --check --tag "$env:RELEASE_TAG"
      - name: Prepare stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release --locked
      - name: Verify embedded executable version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])"
          $binary = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path target/release/lingoleaf.exe))
          if ($binary.FileVersion -cne "$version.0" -or $binary.ProductVersion -cne $version) {
            throw "Built EXE version does not match Cargo.toml"
          }
      - name: Package distribution
        run: python tools/release.py --exe target/release/lingoleaf.exe --out-dir dist
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: lingoleaf-windows-x64
          path: |
            dist/lingoleaf.exe
            dist/lingoleaf-windows-x64.zip
            dist/lingoleaf-*-windows-x64.exe
            dist/SHA256SUMS
            dist/update.json
          if-no-files-found: error

  draft-release:
    name: Publish tagged release
    needs: [windows, core-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'xiaoxiaoawei/test-hub'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: lingoleaf-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download verified Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: lingoleaf-windows-x64
          path: dist
      - name: Verify distribution checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish verified stable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Version metadata/tag checks and both test jobs must pass first.
          # Stable tags publish through the normal release workflow; no per-version gate.
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tags may be published." >&2
            exit 1
          fi
          compatibility_asset="dist/lingoleaf-${RELEASE_TAG#v}-windows-x64.exe"
          cmp dist/lingoleaf.exe "$compatibility_asset"
          draft_state="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$draft_state" == "false" ]]; then
            echo "This version has already been published; existing update assets will not be overwritten." >&2
            exit 1
          fi
          assets=(dist/lingoleaf.exe dist/lingoleaf-windows-x64.zip "$compatibility_asset" dist/SHA256SUMS dist/update.json)
          if [[ "$draft_state" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
          else
            cat > dist/release-notes.md <<'NOTES'
          轻译 Windows x64 版本。主程序下载 `lingoleaf.exe`，解压包为 `lingoleaf-windows-x64.zip`；版本号保留在程序内部和更新记录中。

          已安装旧版可继续使用“检查更新”。版本化 EXE 是供旧更新协议使用的兼容副本，与 `lingoleaf.exe` 字节完全相同；`update.json` 保持兼容格式，`SHA256SUMS` 覆盖全部下载内容。功能与验证记录见 ZIP 内的 README、CHANGELOG 和 `docs/build-validation.md`。
          NOTES
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPO" --verify-tag --latest --title "LingoLeaf $RELEASE_TAG" --notes-file dist/release-notes.md
          fi

  core-tests:
    name: Portable logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test distribution tooling
        run: python -m unittest discover -s tools -p test_release.py
      - name: Check version metadata
        run: python tools/release.py --check
      - name: Prepare stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run tests
        run: cargo test --locked --all-targets
